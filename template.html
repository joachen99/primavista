<style>
  /* Fonts are served with the app (SIL OFL, see fonts/*-OFL.txt): no requests to Google, works offline */
  @font-face { font-family: Fraunces; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/fraunces-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Fraunces; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/fraunces-latin-400-italic.woff2) format('woff2'); }
  @font-face { font-family: Fraunces; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/fraunces-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Inter; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Inter; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/inter-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Inter; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
  :root {
    --paper: #fbf8f2;
    --desk: #efe9de;
    --ink: #1f1b16;
    --muted: #6d655a;
    --line: #ddd4c4;
    --accent: #7a2e2e;
    --accent-soft: #f3e4e0;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--desk); color: var(--ink); font: 14px/1.45 Inter, system-ui, sans-serif; }
  /* ---------- app shell: top bar, settings panel, content, tab bar ---------- */
  html, body { height: 100%; }
  body { overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
  input, select, textarea { -webkit-user-select: text; user-select: text; }
  .app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
  .bar { flex: none; display: flex; align-items: center; gap: 8px; min-height: 58px; padding: calc(7px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 7px calc(12px + env(safe-area-inset-left)); background: rgba(251,248,242,.94); -webkit-backdrop-filter: saturate(1.4) blur(18px); backdrop-filter: saturate(1.4) blur(18px); border-bottom: 1px solid var(--line); z-index: 6; }
  .bar-title { flex: 1; min-width: 0; padding-left: 4px; }
  .bar-title h1 { font: 600 19px/1.2 Fraunces, Georgia, serif; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-title .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-actions { display: flex; gap: 4px; align-items: center; flex: none; }
  .ibtn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 44px; height: 44px; padding: 0 10px; border: 0; border-radius: 12px; background: none; color: var(--accent); font: 500 15px Inter, sans-serif; cursor: pointer; white-space: nowrap; transition: background-color .15s, transform .1s; }
  .ibtn svg { width: 22px; height: 22px; flex: none; }
  .ibtn.pill { background: var(--accent); color: #fff; padding: 0 18px 0 14px; border-radius: 99px; font-weight: 600; }
  .ibtn.pill svg { width: 18px; height: 18px; }
  .ibtn[data-playing="1"] { background: var(--ink); color: #fff; }
  .ibtn[aria-pressed="true"] { background: var(--accent-soft); }
  .ibtn:active { background: var(--accent-soft); transform: scale(.96); }
  .ibtn.pill:active { background: var(--accent); filter: brightness(.9); }
  @media (max-width: 1000px) { .ibtn .opt { display: none; } }
  .body { flex: 1; min-height: 0; display: flex; position: relative; }
  .panel { flex: none; width: 300px; background: var(--paper); border-right: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 18px 18px calc(24px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left)); transition: margin-left .3s cubic-bezier(.2,.8,.2,1), transform .3s cubic-bezier(.2,.8,.2,1); }
  .app.panel-closed .panel, .app.no-panel .panel { margin-left: -300px; }
  .app.no-panel .panel-toggle { display: none; }
  .content { flex: 1; min-width: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: #fff; }
  .scrim { display: none; }
  @media (max-width: 1099px) {
    .panel { position: absolute; top: 0; bottom: 0; left: 0; z-index: 5; margin-left: 0 !important; box-shadow: 0 0 40px rgba(31,27,22,.2); }
    .app.panel-closed .panel, .app.no-panel .panel { transform: translateX(-105%); box-shadow: none; }
    .scrim { display: block; position: absolute; inset: 0; z-index: 4; background: rgba(31,27,22,.22); transition: opacity .3s; }
    .app.panel-closed .scrim, .app.no-panel .scrim { opacity: 0; pointer-events: none; }
  }
  .tabbar { flex: none; display: flex; justify-content: center; gap: 6px; padding: 5px calc(10px + env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); background: rgba(251,248,242,.94); -webkit-backdrop-filter: saturate(1.4) blur(18px); backdrop-filter: saturate(1.4) blur(18px); border-top: 1px solid var(--line); z-index: 6; }
  .tabbar button { flex: 0 1 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; border: 0; background: none; border-radius: 12px; color: var(--muted); font: 500 11px Inter, sans-serif; cursor: pointer; transition: color .15s, background-color .15s; }
  .tabbar svg { width: 25px; height: 25px; }
  .tabbar button[aria-selected="true"] { color: var(--accent); }
  .tabbar button:active { background: var(--accent-soft); }
  @media (min-width: 700px) { .tabbar button { flex-direction: row; gap: 8px; font-size: 14px; } .tabbar svg { width: 23px; height: 23px; } .tabbar button[aria-selected="true"] { background: var(--accent-soft); } }
  .view-in { animation: viewIn .24s ease-out; }
  .swipe-next { animation: swipeNext .28s cubic-bezier(.2,.8,.2,1); }
  .swipe-prev { animation: swipePrev .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } }
  @keyframes swipeNext { from { opacity: 0; transform: translateX(60px); } }
  @keyframes swipePrev { from { opacity: 0; transform: translateX(-60px); } }
  #splash { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: var(--desk); transition: opacity .35s ease; }
  #splash img { width: 112px; height: 112px; border-radius: 25px; box-shadow: 0 10px 30px rgba(60,40,20,.18); }
  #splash.out { opacity: 0; pointer-events: none; }
  .settings { max-width: 640px; margin: 0 auto; padding: 28px 20px 60px; }
  .group-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 8px 14px; }
  .group { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .cell { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 50px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 15px; }
  .cell:first-child { border-top: 0; }
  .cell .muted { color: var(--muted); font-size: 14px; text-align: right; }
  .cell .seg { flex: 1; max-width: 320px; }
  #view-set { background: var(--desk); min-height: 100%; }
  .panel h2 { font: 600 17px Fraunces, Georgia, serif; margin: 0 0 16px; }
  .field { margin-bottom: 16px; }
  .field > label, .field > .lbl { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { flex: 1; border: 0; background: none; padding: 7px 0; font: 500 13px Inter, sans-serif; cursor: pointer; color: var(--ink); border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 2.9em; }
  select, input[type=text] { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: 13px Inter, sans-serif; color: var(--ink); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 8px 12px; border-radius: 8px; font: 500 13px Inter, sans-serif; cursor: pointer; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); width: 100%; padding: 10px; font-size: 14px; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .divider { height: 1px; background: var(--line); margin: 18px 0; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .field > label.check { display: flex; font-size: 13px; font-weight: 400; color: var(--ink); text-transform: none; letter-spacing: 0; margin-bottom: 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .code-row { display: flex; gap: 6px; }
  .code-row input { font-family: ui-monospace, Menlo, monospace; letter-spacing: .05em; }
  .code-row .btn { flex: none; }

  .sheet { background: #fff; padding: 26px 40px 60px; max-width: 1120px; margin: 0 auto; }
  @media screen { #sr-sheet .sheet-head, #th-sheet .sheet-head { display: none; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1.5px solid var(--ink); padding-bottom: 10px; margin-bottom: 26px; gap: 20px; }
  .sheet-head h2 { font: 600 26px/1.1 Fraunces, Georgia, serif; margin: 0; }
  .sheet-head .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .sheet-head .meta { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }

  .exercise { margin-bottom: 30px; page-break-inside: avoid; break-inside: avoid; }
  .ex-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .ex-head h3 { font: 600 16px Fraunces, Georgia, serif; margin: 0; }
  .ex-head .det { color: var(--muted); font-size: 13px; }
  .ex-head .spacer { flex: 1; }
  .play { border-radius: 99px; }
  .play[data-playing="1"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .notation svg { display: block; }
  .sys { position: relative; }
  .mask { position: absolute; top: 0; bottom: 0; pointer-events: none; transition: opacity .25s ease, background-color .2s; opacity: 0; border-radius: 4px; }
  .mask.cur { opacity: 1; background: rgba(122, 46, 46, .07); box-shadow: inset 0 -3px 0 rgba(122,46,46,.5); }
  .mask.gone { opacity: 1; background: repeating-linear-gradient(135deg, #fff 0 9px, #f6f1e8 9px 11px); box-shadow: none; }
  .exercise.running { outline: 2px solid var(--accent-soft); outline-offset: 10px; border-radius: 4px; }
  .pt-status { font-size: 12px; color: var(--accent); font-weight: 600; min-width: 64px; text-align: right; }
  .notation path, .notation text { }

  .instr { font-size: 14px; margin: -8px 0 18px; }
  .qgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 26px; }
  .q { break-inside: avoid; page-break-inside: avoid; }
  .q.wide { grid-column: 1 / -1; }
  .q .qn { font: 600 13px Fraunces, Georgia, serif; }
  .q .qp { font-size: 12px; color: var(--muted); margin-left: 4px; }
  .q .ans { border-bottom: 1px solid #aaa; min-height: 24px; margin-top: 2px; font-size: 13px; padding: 3px 2px; color: var(--accent); font-weight: 500; }
  .q .ans .a { visibility: hidden; }
  .show-answers .q .ans .a { visibility: visible; }
  .range-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 13px; }
  .range-row > span:first-child { width: 72px; color: var(--muted); }
  .range-row select { flex: 1; min-width: 0; }

  .empty, .err { color: var(--muted); padding: 40px 0; text-align: center; }
  .err { color: var(--accent); }
  [hidden] { display: none !important; }

  /* ---------- quiz ---------- */
  .checks { display: grid; gap: 6px; }
  .qz-top { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; font-size: 13px; color: var(--muted); }
  .qz-top .bar { flex: 1; height: 6px; background: var(--desk); border-radius: 99px; overflow: hidden; }
  .qz-top .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .qz-top .clock { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
  .qz-top .clock.low { color: var(--accent); }
  .qz-card { max-width: 640px; margin: 0 auto; text-align: center; }
  .qz-topic { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .qz-prompt { font: 600 22px/1.3 Fraunces, Georgia, serif; margin: 6px 0 18px; }
  .qz-staff { width: 300px; max-width: 100%; margin: 0 auto 24px; }
  .qz-staff.wide { width: 620px; }
  .qz-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
  .qz-choice { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; font: 500 15px Inter, sans-serif; cursor: pointer; color: var(--ink); text-align: left; }
  .qz-choice:hover { border-color: var(--ink); }
  .qz-choice kbd { font: 600 11px Inter, sans-serif; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; background: var(--paper); }
  .qz-choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .qz-choice[aria-pressed="true"] kbd { background: var(--accent); color: #fff; border-color: var(--accent); }
  .qz-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 30px auto 0; max-width: 640px; }
  .qz-dots { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; flex: 1; }
  .qz-dots button { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); background: #fff; font: 500 10px Inter, sans-serif; color: var(--muted); cursor: pointer; padding: 0; }
  .qz-dots button.done { background: var(--ink); color: #fff; border-color: var(--ink); }
  .qz-dots button.here { outline: 2px solid var(--accent); outline-offset: 1px; }
  .qz-hand { text-align: center; margin-top: 30px; }
  .qz-confirm { max-width: 460px; margin: 16px auto 0; padding: 14px 16px; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; font-size: 14px; }
  .qz-confirm .row { margin-top: 10px; }
  .qz-intro { max-width: 520px; margin: 30px auto; text-align: center; }
  .qz-intro p { color: var(--muted); }
  .qz-intro .btn.primary { width: auto; padding: 12px 28px; margin-top: 12px; }
  .res-score { display: flex; align-items: center; gap: 28px; margin-bottom: 28px; }
  .res-big { font: 600 64px/1 Fraunces, Georgia, serif; }
  .res-big small { font-size: 26px; color: var(--muted); }
  .grade { display: inline-block; font: 600 14px Inter, sans-serif; padding: 5px 12px; border-radius: 99px; background: var(--ink); color: #fff; }
  .grade.g-dist { background: #2f5d3a; } .grade.g-merit { background: #3a5a7a; } .grade.g-pass { background: #8a6d2b; } .grade.g-fail { background: var(--accent); }
  .res-meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .res-topics { display: grid; gap: 8px; margin-bottom: 30px; }
  .res-topic { display: grid; grid-template-columns: 140px 1fr 60px; gap: 12px; align-items: center; font-size: 13px; }
  .res-topic .bar { height: 8px; background: var(--desk); border-radius: 99px; overflow: hidden; }
  .res-topic .bar i { display: block; height: 100%; background: var(--ink); }
  .res-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
  .rv { display: grid; grid-template-columns: 34px 200px 1fr; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .rv.wide { grid-template-columns: 34px 1fr; }
  .rv.wide .rv-staff { grid-column: 2; }
  .rv.wide .rv-txt { grid-column: 2; }
  .rv-n { font: 600 14px Fraunces, Georgia, serif; }
  .rv-n.ok { color: #2f5d3a; } .rv-n.bad { color: var(--accent); }
  .rv-txt { font-size: 13px; }
  .rv-txt .yours { color: var(--accent); text-decoration: line-through; }
  .rv-txt .right { color: #2f5d3a; font-weight: 600; }
  @media (max-width: 900px) { .qz-choices { grid-template-columns: 1fr; } .rv { grid-template-columns: 30px 1fr; } .rv-txt { grid-column: 2; } .res-topic { grid-template-columns: 100px 1fr 50px; } }

  /* iPad: touch-friendly controls, iOS-style switches, press feedback */
  button, select, input, label.check { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button { transition: transform .1s, background-color .15s, border-color .15s; }
  .btn:active, .seg button:active, .qz-choice:active { transform: scale(.97); }
  @media (hover: none) { .btn:hover, .qz-choice:hover { border-color: var(--line); } .btn.primary:hover { filter: none; } }
  input[type=checkbox] { -webkit-appearance: none; appearance: none; flex: none; width: 46px; height: 28px; margin: 0; border-radius: 99px; background: #ddd5c7; position: relative; cursor: pointer; transition: background-color .2s; }
  input[type=checkbox]::after { content: ''; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .22s cubic-bezier(.2,.8,.2,1); }
  input[type=checkbox]:checked { background: var(--accent); }
  input[type=checkbox]:checked::after { transform: translateX(18px); }
  .check { flex-direction: row-reverse; justify-content: space-between; min-height: 36px; }
  @media (pointer: coarse) {
    .seg button { padding: 11px 0; font-size: 14px; }
    .btn { min-height: 44px; }

      if (u <= A[0][0]) return A[0][1];
      for (let i = 1; i < A.length; i++) if (u <= A[i][0]) { const [t1, x1] = A[i - 1], [t2, x2] = A[i]; return x1 + (x2 - x1) * (u - t1) / (t2 - t1 || 1); }
      return A[A.length - 1][1];
    };
    const barStartX = (b) => at(b * bar);
    return { at, barStartX, x0, xEnd: A[A.length - 1][1] + 4 };
  }

  // ---------- exam quiz ----------

  const settingsLine = (s) => s.topics.map((x) => topicTitle(x)).join(', ') + ' · ' + t(s.diff) + ' · ' + s.count + ' ' + t('qQuestions').toLowerCase() + (s.time ? ' · ' + t('minutes', { n: s.time }) : '');

  function startQuiz(seed) {

  $('qz-sheet').addEventListener('click', (e) => {

  // ---------- language (Settings tab) ----------

  $('sr-meter').value = S.meter; $('th-topic').value = S.topic; $('pt-hide').value = S.ptHideMode; $('qz-time').value = String(S.qzTime);
  $('sr-countin').checked = S.countIn; $('th-answers').checked = S.answers;
  applyStatic(); syncTempo();


  // installable app (home screen on iPad): offline support via the service worker
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  function start() {
    setPanel(narrow() ? false : S.panelOpen !== false);
    renderSR(); showView(S.view);
    const sp = $('splash'); requestAnimationFrame(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 400); });
  }
  if (abcReady()) start(); else window.addEventListener('load', start);
})();
